name: ci

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
      - name: Install dependencies
        run: yarn install

      - name: Format package.json
        run: yarn biome check package.json --write

      - name: Format MSW worker
        run: yarn biome format --write public/mockServiceWorker.js
        
      - name: Check
        run: yarn check-all